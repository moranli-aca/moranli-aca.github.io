---
layout: default
---

<div id="main" role="main">
  {% include sidebar.html %}

  <article class="page{% if page.classes %} {{ page.classes | join: ' ' }}{% endif %}" itemscope itemtype="https://schema.org/ScholarlyArticle">
    <div class="page__inner-wrap">
      <header>
        {% if page.title %}<h1 class="page__title" itemprop="headline">{{ page.title }}</h1>{% endif %}
        {% if page.venue %}<p>Published in <i>{{ page.venue }}</i></p>{% endif %}
      </header>

      <section class="page__content" itemprop="text">
        {{ content }}
        {% include resource-links.html item=page class="page__resource-links" %}
      </section>
    </div>
  </article>
</div>
