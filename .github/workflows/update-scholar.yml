name: Update Google Scholar citations

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch citation count
        run: python3 scripts/update_scholar.py
      - name: Commit updated count
        run: |
          if git diff --quiet -- _data/scholar.yml; then
            echo "Citation count is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/scholar.yml
          git commit -m "chore: update Google Scholar citations"
          git push
